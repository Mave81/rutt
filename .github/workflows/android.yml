name: Bygg Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera npm-paket
        run: npm install

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bygg debug-APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ladda upp APK:n (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: RUTT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publicera APK:n till grenen "apk" så den kan hämtas via github.com
      - name: Publicera APK till apk-grenen
        run: |
          set +e
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/RUTT-debug.apk
          ls -la /tmp/RUTT-debug.apk
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          OUT=$( {
            echo "--- checkout orphan ---"; git checkout --orphan apk 2>&1
            echo "--- rm cached ---";       git rm -rf --cached . 2>&1 | tail -1
            cp /tmp/RUTT-debug.apk RUTT-debug.apk
            echo "--- add ---";             git add -f RUTT-debug.apk 2>&1
            echo "--- commit ---";          git commit -m "RUTT APK ${{ github.run_number }} [skip ci]" 2>&1 | tail -2
            echo "--- push ---";            git push -f origin apk 2>&1
          } )
          CODE=$?
          echo "$OUT"
          echo "$OUT" | while IFS= read -r l; do [ -n "$l" ] && echo "::error::$l"; done
          exit $CODE
