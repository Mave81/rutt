name: Bygg Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera npm-paket
        run: npm install

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bygg debug-APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ladda upp APK:n (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: RUTT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publicera APK:n till grenen "apk" så den kan hämtas via github.com
      - name: Publicera APK till apk-grenen
        run: |
          mkdir -p /tmp/apkout
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/RUTT-debug.apk
          cd /tmp/apkout
          git init -q -b apk
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add RUTT-debug.apk
          git commit -q -m "RUTT debug APK (bygge ${{ github.run_number }}) [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
