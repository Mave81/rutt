name: Bygg Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # ett bygge tar ~5 min; hänger det avbryts det i stället för att blockera
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera npm-paket
        run: npm install

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Bygg debug-APK
        run: |
          cd android
          chmod +x ./gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          CODE=${PIPESTATUS[0]}
          # Nedladdning från Maven som tar timeout (28 okt: "Read timed out" på react-android) → ett nytt försök
          if [ "$CODE" != "0" ] && grep -qE "Read timed out|Could not download|Could not GET|Connection reset|timed out" /tmp/gradle.log; then
            echo "Nätfel mot Maven – försöker igen"
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
            CODE=${PIPESTATUS[0]}
          fi
          if [ "$CODE" != "0" ]; then
            # Plocka ut sektionen från "FAILURE:" till slut (rotorsaken), cappa till 10 rader (GH-gräns)
            awk '/FAILURE: Build failed/{f=1} f' /tmp/gradle.log | grep -vE "^\s*$" | head -10 \
              | while IFS= read -r L; do echo "::error::$L"; done
            # Reserv: om ingen FAILURE-sektion, ta rader med error:/failed/Exception
            if ! grep -q "FAILURE: Build failed" /tmp/gradle.log; then
              grep -nE "error:|Execution failed|Exception|ninja:|clang|undefined reference|cannot find" /tmp/gradle.log \
                | grep -vE "> Task" | tail -10 | while IFS= read -r L; do echo "::error::$L"; done
            fi
          fi
          exit $CODE

      - name: Ladda upp APK:n (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: RUTT-debug-apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      # Publicera APK:n till grenen "apk" så den kan hämtas via github.com
      - name: Publicera APK till apk-grenen
        run: |
          set +e
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk /tmp/RUTT-debug.apk
          ls -la /tmp/RUTT-debug.apk
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout --orphan apk
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp /tmp/RUTT-debug.apk RUTT-debug.apk
          git add -f RUTT-debug.apk
          git commit -q -m "RUTT APK ${{ github.run_number }} [skip ci]"
          PUSHOUT=$(git push -f origin apk 2>&1); CODE=$?
          echo "$PUSHOUT"
          echo "::error::PUSH(code=$CODE): $(echo "$PUSHOUT" | tr '\n' '¦')"
          exit $CODE
