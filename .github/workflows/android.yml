name: Bygg Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera npm-paket
        run: npm install

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bygg debug-APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Ladda upp APK:n (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: RUTT-debug-apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      # Publicera APK:n till grenen "apk" så den kan hämtas via github.com
      - name: Publicera APK till apk-grenen
        run: |
          set +e
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk /tmp/RUTT-debug.apk
          ls -la /tmp/RUTT-debug.apk
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout --orphan apk
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp /tmp/RUTT-debug.apk RUTT-debug.apk
          git add -f RUTT-debug.apk
          git commit -q -m "RUTT APK ${{ github.run_number }} [skip ci]"
          PUSHOUT=$(git push -f origin apk 2>&1); CODE=$?
          echo "$PUSHOUT"
          echo "::error::PUSH(code=$CODE): $(echo "$PUSHOUT" | tr '\n' '¦')"
          exit $CODE
